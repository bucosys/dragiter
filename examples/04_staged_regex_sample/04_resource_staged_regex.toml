# Staged regex demonstration for 04_dragiter_requirements_profile.md
#
# Pattern 0 cuts on level-2 chapter headings (`## `).
# Pattern 1 runs only on pieces that still exceed pack_limit_chars
# and cuts those pieces on level-3 headings (`### `).
# `####` requirement blocks are not cut: after `###` comes `#`, not whitespace.
#
# Compare with -s --pack-limit-chars 0 (chapter grain only)
# versus -s (section budget 500: several ## chapters overflow onto ###).

[requirements]
glob_patterns = ["04_dragiter_requirements_profile.md"]
regex_patterns = ['^##\s+', '^###\s+']
pack_limit_chars = 500

# Cleans up the pasted-from-a-spreadsheet table in section 5.2. Applied
# to each split piece, in order, after the split and before packing.
# 1. collapse runs of spaces/tabs only - keep line breaks (lists, tables, headings)
# 2. drop Markdown table separator rows and horizontal rules
# 3. shorten remaining dash runs
# 4. collapse surplus blank lines
chunk_substitutions = [
  { pattern = '[ \t]{2,}', replacement = " " },
  { pattern = '^[ \t]*\|?[ \t:|-]*-[ \t:|-]*\|?[ \t]*$', replacement = "" },
  { pattern = '-{3,}', replacement = "-" },
  { pattern = '\n{3,}', replacement = "\n\n" },
]
