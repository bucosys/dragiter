# Staged regex demonstration for 04_dragiter_requirements_profile.md
#
# Pattern 0 cuts on level-2 chapter headings (`## `).
# Pattern 1 runs only on pieces that still exceed pack_limit_chars
# and cuts those pieces on level-3 headings (`### `).
# `####` requirement blocks are not cut: after `###` comes `#`, not whitespace.
#
# Compare:
#   dragiter -s --pack-limit-chars 0  …   → overflow off, 49 chapter-grain chunks
#   dragiter -s                          …   → budget 4000, 75 packed chunks

[requirements]
glob_patterns = ["04_dragiter_requirements_profile.md"]
regex_patterns = ['^##\s+', '^###\s+']
pack_limit_chars = 4000
