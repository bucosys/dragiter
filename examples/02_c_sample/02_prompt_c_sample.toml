[system]
instruction = """
You are a Principal Software Security Auditor and a distinguished C/C++ architect.
You analyse legacy code with ruthless precision. You do not tolerate missing pointer validations or potential memory leaks. Always answer in British English, maintaining a highly professional, objective, and analytical tone.
"""

[task]

first = """
### REFERENCE MATERIAL
Conduct a rigorous review of the following legacy C codebase fragments:
"""

material = """
==================================================
ID: {CHUNK_NUM_ID:04d}
FILE: {CHUNK_FILE_NAME}
SECTION: {CHUNK_SECTION_NAME}
CONTENT:

{CHUNK_CONTENT}
==================================================
"""

synthesis = """
Perform a strict static code analysis on the provided source code chunk.

Your audit must explicitly address the following:
1. **Vulnerability Assessment:** Identify any memory safety issues, missing `NULL` pointer checks, or lack of array bounds validation.
2. **Refactored Implementation:** Provide a modernised, robust version of the function that includes proper defensive programming practices (e.g., input validation).
3. **Architectural Verdict:** Give a brief assessment of the code's readiness for production in a modern, secure system.

Structure your response strictly with clear Markdown headings.
"""

[behaviour]
temperature = 0.0

# CRITICAL: Ensures that each code chunk is evaluated individually.
# Feeding the entire codebase into a single prompt leads to shallow analysis and missed vulnerabilities.
# Isolated, sequential processing guarantees maximum analytical depth per function.
sequential_processing = false


[outcome]
output_filename_schema = "security_audit_report.md"
output_delimiter = "\n\n---\n\n"