# dragiter Configuration Template for Google Gemini (OpenAI compatible)

# API Key options:
# You can either uncomment the line below and insert your Google API key,
# or leave it commented out and provide the key via command line
# (--api-key) or the DRAGITER_API_KEY environment variable.
#
# Storing API keys in configuration files requires careful consideration
# regarding security and access control. In shared, team, or production
# environments it is generally advisable to use environment variables
# or dedicated secret management solutions instead.

# api_key="YOUR-GROK-API-KEY-HERE"
base_url = "https://api.x.ai/v1"
model_name = "grok-4.3"

# ===================================================================
# Optional advanced settings (uncomment and adjust as needed)
# ===================================================================

# Average characters per token for token estimation (default: 4.0)
# chars_per_token = 3.8

# Maximum number of tokens available for complete request (prompt, material and output)
# max_context_tokens = 128000

# Maximum number of tokens the model is allowed to generate as output.
# This value is used for dragiter's token estimation AND passed to the API
# as max_tokens. Always leave some buffer for the answer.
# max_output_tokens = 8192

# Delay in seconds between retry attempts
# retry_delay = 5

# Maximum number of retry attempts before giving up
# max_retry = 3
