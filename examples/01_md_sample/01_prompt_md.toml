# example prompt template file

[system]
instruction = """
You are a precise analyst.
Always answer in English and use Markdown tables.
"""

[task]
first = """
### REFERENCE MATERIAL
Use the following material as a knowledge base:
"""

material = """
ID: {CHUNK_NUM_ID:04d}
FILE: {CHUNK_FILE_NAME}
SECTION: {CHUNK_SECTION_NAME}
SECTION NUM ID: {CHUNK_SECTION_NUM_ID}
CONTENT:

{CHUNK_CONTENT}
"""

synthesis = """
As a precise analyst, evaluate the provided historical reference material to answer the following core question:

**"{LOOP_CONTENT}"**

Extract the key arguments from the text and present your findings strictly as a Markdown table with the columns: "Historical Concept", "Core Argument", and "Meaning for Modern AI".
"""

temperature = 0.0
sequential_processing = false

[output]
output_delimiter = "\n---\n"
output_filename_schema = "sample_01.txt"