# ===================================================================
# REVISITED: 2026-08-15 Configuration Update
# ===================================================================
#
# dragiter Configuration Template (claude)
#
# IMPORTANT SECURITY NOTICE
# ------------------------------------------------------------------
# NEVER put a real API key into this file.
#
# Storing secrets in configuration files is a serious security risk
# (version control, backups, shared machines, accidental commits …).
#
# Recommended approaches:
#
#   A) Single provider (simplest)
#      Export the key directly into the variable that dragiter reads:
#
#        export DRAGITER_API_KEY="sk-ant-..."
#
#      Then just call:
#        dragiter -v -c config-claude.toml -p prompt.toml …
#
#   B) Multiple providers
#      Keep provider-specific keys and map them only for the current call:
#
#        export CLAUDE_API_KEY="sk-ant-..."
#        export GEMINI_API_KEY="AIza..."
#        # …
#
#        DRAGITER_API_KEY="$CLAUDE_API_KEY" \
#          dragiter -v -c config-claude.toml -p prompt.toml …
#
# You can also pass the key on the command line with --api-key,
# but the environment-variable forms above are preferred.
#
# Leave the api_key line below commented out.
# ===================================================================

# api_key = "DO-NOT-PUT-A-REAL-KEY-HERE"
base_url = "https://api.anthropic.com/v1"
model_name = "claude-sonnet-4-6"


# ===================================================================
# Optional advanced settings (uncomment and adjust as needed)
# ===================================================================

# Average characters per token for token estimation (default: 4.0)
# chars_per_token = 3.8

# Maximum context window of the model (input + output)
# max_context_tokens = 128000

# Maximum number of tokens the model is allowed to generate as output.
# This value is used for dragiter's token estimation AND passed to the API
# as max_tokens. Always leave some buffer for the answer.
# max_output_tokens = 8192

# Delay in seconds between retry attempts
# retry_delay = 5

# Maximum number of retry attempts before giving up
# max_retry = 3
