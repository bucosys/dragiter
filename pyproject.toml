[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dragiter"
version = "2026.07.18b3"
description = "dragiter – Deterministic RAG Iterator. A modular CLI for structured, reproducible LLM workflows."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later OR Proprietary" }
license-files = ["LICENSE", "LICENSE.AGPL-3.0"]

authors = [{ name = "Michael Buchold", email = "michael.buchold@dragiter.app" }]
maintainers = [{ name = "Michael Buchold", email = "michael.buchold@dragiter.app" }]

keywords = ["cli", "llm", "rag", "automation", "prompt-engineering", "ai-workflow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

dependencies = [
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff",
    "mypy",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://gitlab.com/bucosys/dragiter"
Repository = "https://gitlab.com/bucosys/dragiter.git"
Issues = "https://gitlab.com/bucosys/dragiter/-/issues"
Documentation = "https://gitlab.com/bucosys/dragiter/-/blob/main/docs/manual.md"

[project.scripts]
dragiter = "dragiter.cli:main"
dragiter-gen-docs = "dragiter.cli:gen_docs"
dragiter-gen-examples = "dragiter.cli:gen_examples"
dragiter-gen-tests = "dragiter.cli:gen_tests"

# ====================== Hatch Build Configuration ======================
[tool.hatch.build.targets.wheel]
packages = ["src/dragiter"]

# WICHTIG: docs/ und examples/ werden absichtlich ins Wheel gepackt,
# damit dragiter-gen-docs und dragiter-gen-examples nach der Installation
# funktionieren (sie nutzen importlib.resources.files("dragiter")).
[tool.hatch.build.targets.wheel.force-include]
"examples" = "dragiter/examples"
"docs" = "dragiter/docs"
"tests" = "dragiter/tests"
"tests/configs" = "dragiter/tests/configs"

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "examples/",
    "docs/",
    "tests/",
    "tests/configs/",
    "LICENSE*",
    "README.md",
    "pyproject.toml",
]