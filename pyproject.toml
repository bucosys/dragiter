[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dragiter"
version = "2026.9.29"
description = "dragiter - Deterministic Context Iterator. A focused command-line tool for structured, reproducible LLM workflows."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later OR Proprietary" }
license-files = ["LICENSE", "LICENSE.AGPL-3.0"]

authors = [{ name = "Michael Buchold", email = "michael.buchold@dragiter.app" }]
maintainers = [{ name = "Michael Buchold", email = "michael.buchold@dragiter.app" }]

keywords = ["cli", "llm", "rag", "automation", "prompt-engineering", "ai-workflow"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]

dependencies = [
    "openai>=3.0.0,<4.0.0",
    "httpx2>=2.7.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.3",
    "build",
    "twine",
    "httpx>=0.27.0",  # test doubles only (httpx.Request/Response); not used at runtime
]

[project.urls]
Homepage = "https://www.dragiter.app/"
Repository = "https://gitlab.com/bucosys/dragiter.git"
Issues = "https://gitlab.com/bucosys/dragiter/-/issues"
Documentation = "https://www.dragiter.app/"

[project.scripts]
dragiter = "dragiter.cli:main"
dragiter-gen-docs = "dragiter.cli:gen_docs"
dragiter-gen-examples = "dragiter.cli:gen_examples"

# ====================== Hatch Build Configuration ======================
[tool.hatch.build.targets.wheel]
packages = ["src/dragiter"]

# IMPORTANT: docs/ and examples/ are intentionally included in the Wheel
# so that dragiter-gen-docs and dragiter-gen-examples work after installation
# (they use importlib.resources.files("dragiter")).
[tool.hatch.build.targets.wheel.force-include]
"assets" = "dragiter/assets"
"examples" = "dragiter/examples"
"docs" = "dragiter/docs"

[tool.hatch.build.targets.sdist]
include = [
    "assets/",
    "design/",   # ADRs and specifications referenced from src/ and tests/
    "src/",
    "examples/",
    "docs/",
    "tests/",
    "LICENSE*",
    "README.md",
    "CHANGELOG.md",
    "pyproject.toml",
]
exclude = [
    "/web",
    "/web/**",
    "/site",
    "/site/**",
    "/.git",
    "/.gitlab-ci.yml",
    "/mkdocs.yml",
    "**/__pycache__",
    "**/*.pyc",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "test"]

extend-exclude = [
    "web",
    "site",
    ".venv",
    "build",
    "dist",
    ".ruff_cache",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes (F401, F811, F841 …)
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "C4",     # flake8-comprehensions
    "RUF",    # Ruff-specific
]
ignore = [
    "E501",   # line too long
]

[tool.ruff.lint.isort]
known-first-party = ["dragiter"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
