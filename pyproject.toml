[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dragiter"
version = "2026.7.26"
description = "dragiter – Deterministic RAG Iterator. A modular CLI for structured, reproducible LLM workflows."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.13"
license = { text = "AGPL-3.0-or-later OR Proprietary" }
license-files = ["LICENSE", "LICENSE.AGPL-3.0"]

authors = [{ name = "Michael Buchold", email = "michael.buchold@dragiter.app" }]
maintainers = [{ name = "Michael Buchold", email = "michael.buchold@dragiter.app" }]

keywords = ["cli", "llm", "rag", "automation", "prompt-engineering", "ai-workflow"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

dependencies = [
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://gitlab.com/bucosys/dragiter"
Repository = "https://gitlab.com/bucosys/dragiter.git"
Issues = "https://gitlab.com/bucosys/dragiter/-/issues"
Documentation = "https://gitlab.com/bucosys/dragiter/-/blob/main/docs/manual.md"

[project.scripts]
dragiter = "dragiter.cli:main"
dragiter-gen-docs = "dragiter.cli:gen_docs"
dragiter-gen-examples = "dragiter.cli:gen_examples"

# ====================== Hatch Build Configuration ======================
[tool.hatch.build.targets.wheel]
packages = ["src/dragiter"]

# IMPORTANT: docs/ and examples/ are intentionally included in the Wheel
# so that dragiter-gen-docs and dragiter-gen-examples work after installation
# (they use importlib.resources.files("dragiter")).
[tool.hatch.build.targets.wheel.force-include]
"assets" = "dragiter/assets"
"examples" = "dragiter/examples"
"docs" = "dragiter/docs"

[tool.hatch.build.targets.sdist]
include = [
    "assets/",
    "src/",
    "examples/",
    "docs/",
    "tests/",
    "LICENSE*",
    "README.md",
    "pyproject.toml",
]
