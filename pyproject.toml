[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dragiter"
version = "0.2026.06.14"
description = "dragiter - Deterministic RAG Iterator. Modular CLI for LLM workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "Michael Buchold", email = "michael.buchold@bucosys.com" }
]

keywords = ["cli", "llm", "rag", "automation", "prompt-engineering", "ai-workflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

dependencies = [
    "openai>=1.0.0",
]

[project.urls]
Homepage = "https://gitlab.com/bucosys/dragiter"
Repository = "https://gitlab.com/bucosys/dragiter.git"
Issues = "https://gitlab.com/bucosys/dragiter/-/issues"
Documentation = "https://gitlab.com/bucosys/dragiter/-/blob/main/docs/manual.md"

[project.scripts]
dragiter = "dragiter.cli:main"
dragiter-gen-docs = "dragiter.cli:gen_docs"
dragiter-gen-examples = "dragiter.cli:gen_examples"

# ====================== Hatch Build Configuration ======================
[tool.hatch.build.targets.wheel]
packages = ["src/dragiter"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "examples",
    "docs",
    "LICENSE*",
    "README.md",
]

exclude = [
    "*.tar",
    "*.tgz",
    "run/",
    "dist/",
    ".git/",
    ".idea/",
    ".vscode/",
    "__pycache__/",
    "*.pyc",
    ".DS_Store",
]

[tool.hatch.build.targets.wheel.force-include]
"examples" = "dragiter/examples"
"docs" = "dragiter/docs"
