stages:
  - test
  - deploy

pytest:
  stage: test
  image: python:3.13-slim
  before_script:
    - pip install --no-cache-dir -e ".[dev]"
  script:
    - pytest tests/ -v
      --ignore=tests/test_functional_ollama.py
      --ignore=tests/test_functional_caddy_ca_bundle.py
      --ignore=tests/test_functional_caddy_mtls.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

pages:
  stage: deploy
  image: python:3.13-slim
  before_script:
    - pip install --no-cache-dir mkdocs mkdocs-material
  script:
    - cp -f docs/manual.md web/manual.md
    - cp -f docs/reference.md web/reference.md
    - cp -f docs/faq.md web/faq.md
    - cp -f docs/glossary.md web/glossary.md
    - cp -f docs/window-starting-values.md web/window-starting-values.md
    - cp -f README.md web/index.md
    - |
      cat << 'EOF' >> web/index.md
      
      ## Legal
      
      - [Legal Notice / Impressum](legal_notice.md)
      - [Privacy Policy](privacy_policy.md)
      EOF
    - mkdocs build --site-dir public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"