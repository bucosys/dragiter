site_name: dragiter
site_url: https://www.dragiter.app/
docs_dir: web
site_description: "Deterministic CLI for structured, reproducible LLM workflows. Treats LLMs like a Unix pipeline — no chat, no hidden state."

theme:
  name: material
  logo: assets/logo/dragiter-logo.png
  favicon: assets/logo/dragiter-logo.png
  palette:
    # Optional: Automatic toggle between light and dark mode based on system preference
    # (Note: CSS media queries require the US spelling 'color')
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Define your navigation structure here
nav:
  - Home: index.md
  - Manual: manual.md
  - Reference: reference.md
  - FAQ: faq.md
  - Suggested settings: suggested-settings.md
  - Glossary: glossary.md
  - Legal Notice / Impressum: legal_notice.md
  - Privacy Policy: privacy_policy.md

plugins:
  - search
  - privacy